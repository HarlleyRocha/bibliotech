<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Bibliotech</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/usuario.css" />
</head>
<body>
  <!-- Navbar Superior -->
  <header class="navbar">
    <div class="navbar-logo">Bibliotech</div>
    <nav class="navbar-links">
      <a href="catalogo.html" class="ativo">Catálogo</a>
      <a href="conta.html">Minha conta</a>
      <a href="doar.html">Doar livro</a>
    </nav>
  </header>

  <main class="conteudo-principal">
    <!-- Barra de Filtros -->
    <div class="catalogo-filtros">
      <div class="campo campo-busca">
        <input type="text" placeholder="Buscar por título, autor ou ISBN" />
      </div>
      <div class="campo campo-categoria">
        <select>
          <option value="">Categoria</option>
          <option value="literatura">Literatura Brasileira</option>
          <option value="ficcao">Ficção Científica</option>
          <option value="fantasia">Fantasia</option>
          <option value="autoajuda">Autoajuda</option>
        </select>
      </div>
    </div>

    <!-- Grid de Livros -->
    <div class="grid-livros">
      
      <!-- Livro 1 -->
      <article class="card-livro">
        <img src="https://via.placeholder.com/300x400?text=Capa" alt="Capa do livro" class="card-livro-capa" />
        <div class="card-livro-info">
          <h2 class="card-livro-titulo">Dom Casmurro</h2>
          <p class="card-livro-autor">Machado de Assis</p>
          <span class="card-livro-categoria">Literatura Brasileira</span>
        </div>
        <div class="card-livro-disponibilidade">
          📚 Disponível: 3
        </div>
        <button class="btn btn-secundario btn-bloco">Realizar empréstimo</button>
      </article>

      <!-- Livro 2 -->
      <article class="card-livro">
        <img src="https://via.placeholder.com/300x400?text=Capa" alt="Capa do livro" class="card-livro-capa" />
        <div class="card-livro-info">
          <h2 class="card-livro-titulo">1984</h2>
          <p class="card-livro-autor">George Orwell</p>
          <span class="card-livro-categoria">Ficção Científica</span>
        </div>
        <div class="card-livro-disponibilidade">
          📚 Disponível: 3
        </div>
        <button class="btn btn-secundario btn-bloco">Realizar empréstimo</button>
      </article>

      <!-- Livro 3 (Indisponível) -->
      <article class="card-livro">
        <img src="https://via.placeholder.com/300x400?text=Capa" alt="Capa do livro" class="card-livro-capa" />
        <div class="card-livro-info">
          <h2 class="card-livro-titulo">O Pequeno Príncipe</h2>
          <p class="card-livro-autor">Antoine de Saint-Exupéry</p>
          <span class="card-livro-categoria">Literatura Infantojuvenil</span>
        </div>
        <div class="card-livro-disponibilidade">
          🚫 Indisponível
        </div>
        <button class="btn btn-secundario btn-bloco">Entrar na fila</button>
      </article>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
